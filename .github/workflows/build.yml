name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.build-tools/vcpkg
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: dc31f86a441067d6c2e9e4ad52988eb41ef4f442
          path: .build-tools/vcpkg
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja ffmpeg --yes --no-progress
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config ffmpeg
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ffmpeg
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure
        run: cmake --preset debug -DRACEVIDEO_FFMPEG_TESTS=ON
      - name: Build
        run: cmake --build --preset debug --parallel 3
      - name: Test
        run: ctest --preset debug
